services:
  
#user-service

  user-service:
    build:
      context: .
      dockerfile: docker/springboot.Dockerfile
      args:
       SERVICE_DIR: services/user-service
       SERVICE_PORT: 8081

    image: ecommerce-user-service:1.0
    container_name: ecommerce-user-service
    ports:
      - "8081:8081"
    networks:
      - ecommerce-network       
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ecommerce-postgres:5432/users_db
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=localdev

    mem_limit: 512m
    cpus: 0.5

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5

    restart: unless-stopped

