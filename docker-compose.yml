#frontend-service

  frontend-service:
    build:
      context: /frontend
      dockerfile: Dockerfile
      
    image: ecommerce-frontend:1.0
    container_name: ecommerce-frontend
    ports:
      - "3000:80"
    networks:
      - ecommerce-network

    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service 

    mem_limit: 512m
    cpus: 0.5

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    restart: unless-stopped



networks:
  ecommerce-network:
    external: true
    





